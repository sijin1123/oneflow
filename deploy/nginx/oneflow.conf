map $http_upgrade $oneflow_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:5173;
    server_name oneflow.nexvione.net;

    root /opt/oneflow/prod/current/apps/web/dist;
    index index.html;
    client_max_body_size 50m;

    access_log /var/log/nginx/oneflow-prod.access.log;
    error_log /var/log/nginx/oneflow-prod.error.log warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oneflow_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

